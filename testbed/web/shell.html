<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>tinywfc city</title>
   <meta name="description" content="Wave function collapse building a small 3d city in the browser: tinywfc compiled to WebAssembly.">
   <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #b3c7db; color: #222; font: 14px system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; }
      #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
      #source { position: fixed; right: 12px; bottom: 10px; color: #1d4f7a; text-decoration: none; }
      #source:hover { text-decoration: underline; }
   </style>
</head>
<body>
   <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
   <div id="status">loading...</div>
   <a id="source" href="https://github.com/varnholt/tinywfc" target="_blank" rel="noopener">tinywfc on GitHub</a>
   <script>
      const status = document.getElementById("status");
      if (!document.createElement("canvas").getContext("webgl2")) {
         status.textContent = "this demo needs WebGL 2, which this browser does not offer";
      }
      var Module = {
         canvas: document.getElementById("canvas"),
         setStatus: (text) => { status.textContent = text; },
         onRuntimeInitialized: () => { status.style.display = "none"; },
         onAbort: (reason) => { status.style.display = "flex"; status.textContent = "the demo stopped: " + reason; },
      };
   </script>
   {{{ SCRIPT }}}
</body>
</html>
